<svg xmlns="http://www.w3.org/2000/svg" width="180" height="60" viewBox="0 0 180 60">
    <!-- hard-edged offset shadow (no blur), matching the coin/panel cartoon style -->
    <rect x="8" y="8" width="172" height="52" rx="16" fill="#000000" />
    <rect x="4" y="4" width="172" height="52" rx="16" fill="#22C55E" stroke="#ffffff"
        stroke-width="5" />
    <text x="90" y="38" font-family="'Segoe UI', system-ui, sans-serif" font-size="24"
        font-weight="900" fill="#ffffff" text-anchor="middle" stroke="#000000" stroke-width="4"
        stroke-linejoin="round" paint-order="stroke">Upgrade</text>
</svg>